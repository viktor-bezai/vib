[tool.ruff]
# Exclude common directories that don't need linting
exclude = [
    # Version control
    ".git",
    ".hg",
    ".mypy_cache",
    ".ruff_cache",
    ".svn",
    
    # Python cache
    "__pycache__",
    "*.pyc",
    ".pytest_cache",
    
    # Virtual environments
    ".env",
    ".venv",
    "env",
    "venv",
    "ENV",
    "env.bak",
    "venv.bak",
    
    # IDEs
    ".idea",
    ".vscode",
    "*.swp",
    "*.swo",
    
    # Django specific
    "*/migrations/*",
    "backend/staticfiles/*",
    "backend/media/*",
    "staticfiles",
    "media",
    
    # Frontend directories (not Python code)
    "frontend/*",
    "node_modules",
    
    # Docker and deployment
    "docker/*",
    "nginx/*",
    
    # Scripts and backups
    "scripts/backups/*",
    
    # Build and dist
    "build",
    "dist",
    "*.egg-info",
    ".eggs",
    
    # Documentation
    "docs/*",
    "documentation/*",
    
    # Test coverage
    "htmlcov",
    ".coverage",
    ".coverage.*",
    "coverage.xml",
    "*.cover",
    
    # Temporary files
    "*.log",
    "*.pot",
    "*.mo",
    "*~",
    
    # OS specific
    ".DS_Store",
    "Thumbs.db",
    
    # Project specific
    "backend/templates/*",  # HTML templates
]

# Set Python version target
target-version = "py311"

# Django apps live under backend/, so imports resolve from there ("accounts", not "backend.accounts").
src = ["backend"]

# Line length (increased from 88 to 120 for better readability on modern displays)
line-length = 120

[tool.ruff.lint]
# pycodestyle (E), Pyflakes (F), isort (I), and TID252: absolute imports only (CLAUDE.md)
select = ["E", "F", "I", "TID252"]

# Additional rules to ignore globally
ignore = [
    "E501",  # Line too long (handled by formatter)
    "F401",  # Imported but unused (sometimes needed for Django)
]

[tool.ruff.lint.per-file-ignores]
# Django settings files often use wildcard imports
"**/settings/*.py" = ["F403", "F405"]
# __init__.py files may have unused imports for API exposure
"**/__init__.py" = ["F401"]
# Migrations are auto-generated, exclude all checks
"*/migrations/*.py" = ["E", "F", "I"]

[tool.ruff.lint.isort]
# Configure isort settings for Django
section-order = ["future", "standard-library", "django", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort.sections]
# Define Django as a separate section
django = ["django"]

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"

# Indent with spaces
indent-style = "space"

# Unix-style line endings
line-ending = "lf"