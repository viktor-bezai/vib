name: CI

# Same structure as EnvolPrep's ci.yml. VIB has no frontend tests yet, so it has four checks,
# not five; deploy.yml requires exactly these four.
on:
  pull_request:
    branches:
      - master
      - preview

# Read only, so no PR can push an image under a master SHA that a deploy would then reuse.
permissions:
  contents: read

# A new push to a PR stops the run for its older commit: only the newest one counts.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Decides which sides a PR touches. A side with no changes still reports "success" (its job
  # stops after one step), so the deploy gate, which requires every check, stays strict.
  # Into master the diff is the whole release against master, so a side no release touched
  # skips only because its checks already passed on exactly that code.
  #
  # Tests and builds run only on release PRs into master, to save Actions minutes. Feature PRs
  # into preview run only the lint job. Every job below needs this one, so skipping it skips them all.
  changes:
    name: Detect changed sides
    if: github.base_ref == 'master'
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      frontend: ${{ steps.diff.outputs.frontend }}
      images: ${{ steps.diff.outputs.images }}
    steps:
      # The PR merge commit's first parent is the base branch, so depth 2 is enough.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: List changed paths
        id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only HEAD^1 HEAD)
          echo "Comparing against $BASE_REF:"
          echo "$CHANGED"

          # Only this workflow itself changes how both sides are checked.
          SHARED='^\.github/workflows/ci\.yml$'
          has() { grep -Eq "$1|$SHARED" <<< "$CHANGED" && echo true || echo false; }

          echo "backend=$(has '^backend/')" >> "$GITHUB_OUTPUT"
          echo "frontend=$(has '^frontend/')" >> "$GITHUB_OUTPUT"

          # The images deploy.yml builds, each only when a file its build reads differently from
          # the checks changes: the Dockerfile, the prod lock and the entrypoint, or the frontend's
          # Dockerfile, packages and Next.js config.
          images=()
          if [[ $(has '^backend/(Dockerfile|\.dockerignore|requirements\.txt|entrypoint\.sh)$') == true ]]; then images+=(backend); fi
          if [[ $(has '^frontend/(Dockerfile|\.dockerignore|package(-lock)?\.json|next\.config\.ts)$') == true ]]; then images+=(frontend); fi
          echo "images=$(jq -cn '$ARGS.positional' --args "${images[@]}")" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint (Ruff + Prettier)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # The locked version, the same one scripts/format-all.sh runs from the local venv.
      # format-all.sh is told to use it below (RUFF).
      - name: Install Ruff
        run: pip install "$(grep '^ruff==' backend/requirements-dev.txt)"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run format-all.sh --check
        run: ./scripts/format-all.sh --check
        env:
          RUFF: ruff

  test-backend:
    name: Backend tests
    needs: changes
    runs-on: ubuntu-latest
    services:
      postgres:
        # Docker Hub's mirror: anonymous Docker Hub pulls are rate-limited on shared runners.
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_DB: vib
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: test-secret-key-not-for-production
      DJANGO_SETTINGS_MODULE: config.settings.local
      POSTGRES_NAME: vib
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
    steps:
      - name: No backend changes
        if: needs.changes.outputs.backend != 'true'
        run: echo "Nothing under backend/ changed, so this check passes without running."

      - name: Checkout
        if: needs.changes.outputs.backend == 'true'
        uses: actions/checkout@v7

      - name: Set up Python
        if: needs.changes.outputs.backend == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      # The dev lockfile holds every app dependency plus the dev tools.
      - name: Install dependencies
        if: needs.changes.outputs.backend == 'true'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Django system checks
        if: needs.changes.outputs.backend == 'true'
        working-directory: backend
        run: python manage.py check

      - name: Check for missing migrations
        if: needs.changes.outputs.backend == 'true'
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      # Every endpoint must be documented; a view the schema cannot describe fails the build.
      - name: Check OpenAPI schema
        if: needs.changes.outputs.backend == 'true'
        working-directory: backend
        run: python manage.py spectacular --file /tmp/schema.yml --validate --fail-on-warn

      - name: Run tests
        if: needs.changes.outputs.backend == 'true'
        working-directory: backend
        run: python manage.py test --parallel --noinput

  lint-frontend:
    name: Frontend lint (ESLint)
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: No frontend changes
        if: needs.changes.outputs.frontend != 'true'
        run: echo "Nothing under frontend/ changed, so this check passes without running."

      - name: Checkout
        if: needs.changes.outputs.frontend == 'true'
        uses: actions/checkout@v7

      - name: Set up Node
        if: needs.changes.outputs.frontend == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm ci

      # --max-warnings=0 is in the script, so anything new fails here.
      - name: Run ESLint
        if: needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm run lint

  build-frontend:
    name: Frontend build
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: No frontend changes
        if: needs.changes.outputs.frontend != 'true'
        run: echo "Nothing under frontend/ changed, so this check passes without running."

      - name: Checkout
        if: needs.changes.outputs.frontend == 'true'
        uses: actions/checkout@v7

      - name: Set up Node
        if: needs.changes.outputs.frontend == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm ci

      # next-env.d.ts is generated, not in git: `next typegen` writes it before tsc reads it.
      - name: Type-check (next typegen + tsc --noEmit)
        if: needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm run typecheck

      - name: Build (next build)
        if: needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm run build

  # Not one of the checks the deploy gate requires: a broken build already stops the deploy
  # before the server is touched. This only moves that failure from master to the release PR,
  # which also tests the Dependabot updates merged into preview since the last release.
  build-images:
    name: Build ${{ matrix.service }} image
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: ./.github/actions/setup-buildx

      # The same context as the build job in deploy.yml. No push and no layer cache, so the
      # deploy's cache on master stays its own.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.service }}
          push: false
          provenance: false
          sbom: false
