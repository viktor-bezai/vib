name: Deploy VIB

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /home/deploy/vib

            # Pull latest code (production tracks master; origin/main does not exist)
            git fetch origin master
            git reset --hard origin/master

            # Update nginx config and enable maintenance mode
            echo "Updating nginx config..."
            cp server-configs/nginx/viktorbezai.online /etc/nginx/sites-available/viktorbezai.online
            nginx -t && systemctl reload nginx

            echo "Enabling maintenance mode..."
            cp server-configs/maintenance.html /var/www/maintenance-vib.html
            touch /var/www/maintenance-vib.flag

            # Create .env from secrets
            cat > .env << 'EOF'
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            ENVIRONMENT=production
            POSTGRES_NAME=${{ secrets.POSTGRES_NAME }}
            POSTGRES_HOST=${{ secrets.POSTGRES_HOST }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
            EOF

            # Create frontend env
            cat > frontend/.env.production << 'EOF'
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
            EOF

            # Build and restart containers
            docker-compose -f docker-compose.prod.yml down
            docker-compose -f docker-compose.prod.yml build
            docker-compose -f docker-compose.prod.yml up -d

            # Wait for services to be healthy using each container's OWN
            # healthcheck status (docker-compose.prod.yml defines them with the
            # correct Host, so this avoids ALLOWED_HOSTS 400s that a raw
            # 127.0.0.1 curl would hit). This box is memory-tight, so startup
            # (migrate + collectstatic + gunicorn / Next boot) can be slow -
            # allow up to 300s and print a heartbeat so the log never looks stuck.
            echo "Waiting for services to become healthy..."
            healthy=0
            for i in $(seq 1 100); do
              be=$(docker inspect -f '{{.State.Health.Status}}' vib-backend 2>/dev/null || echo missing)
              fe=$(docker inspect -f '{{.State.Health.Status}}' vib-frontend 2>/dev/null || echo missing)
              if [ "$be" = "healthy" ] && [ "$fe" = "healthy" ]; then
                healthy=1
                echo "Services healthy after $((i * 3))s"
                break
              fi
              [ $((i % 10)) -eq 0 ] && echo "  still waiting (${i}x3s): backend=$be frontend=$fe"
              sleep 3
            done

            # Always lift maintenance so the flag can never get stuck on. If the
            # app is still warming up, nginx's error_page 502/503/504 fallback
            # serves the branded page instead of a raw gateway error.
            echo "Disabling maintenance mode..."
            rm -f /var/www/maintenance-vib.flag

            if [ "$healthy" != "1" ]; then
              echo "WARNING: services not healthy within 300s; nginx fallback covers until ready."
              docker-compose -f docker-compose.prod.yml ps
              exit 1
            fi

            # Cleanup
            docker image prune -f

            echo "Deployed successfully!"
