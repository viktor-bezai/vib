name: Docker Hub mirror
description: Point the runner's Docker daemon at Google's Docker Hub mirror, for plain docker and compose.

runs:
  using: composite
  steps:
    - name: Use mirror.gcr.io for Docker Hub pulls
      shell: bash
      run: |
        # Why: see .github/actions/setup-buildx. This is its twin for the pulls and builds that go
        # through the daemon (plain docker and compose). The daemon falls back to Docker Hub on a miss.
        config=/etc/docker/daemon.json
        current="$(sudo cat "$config" 2>/dev/null || echo '{}')"
        jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' <<<"$current" | sudo tee "$config" >/dev/null
        sudo systemctl restart docker
        docker info --format 'Registry mirrors: {{.RegistryConfig.Mirrors}}'
